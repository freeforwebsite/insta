name: Spotify Playlist Cloud Downloader

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: "Spotify Playlist or Track URL"
        required: true
        default: "https://open.spotify.com/playlist/7eMHkKCKwelg7afYViQMAf"
      part:
        description: "Select Part ('all' runs Parts 1-5 automatically, 'test_5_songs' for sample)"
        required: true
        type: choice
        options:
          - "all"
          - "test_5_songs"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "custom"
        default: "all"
      start_index:
        description: "Custom Start Index (Only used if part is 'custom')"
        required: false
        default: "1"
      end_index:
        description: "Custom End Index (Only used if part is 'custom')"
        required: false
        default: "5"
      quality:
        description: "Audio Bitrate (kbps)"
        required: true
        type: choice
        options:
          - "320"
          - "192"
          - "128"
        default: "320"

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.set-parts.outputs.parts }}
    steps:
      - id: set-parts
        run: |
          PART="${{ github.event.inputs.part }}"
          if [ "$PART" = "all" ]; then
            echo 'parts=["1", "2", "3", "4", "5"]' >> $GITHUB_OUTPUT
          elif [ "$PART" = "test_5_songs" ]; then
            echo 'parts=["test_5_songs"]' >> $GITHUB_OUTPUT
          elif [ "$PART" = "custom" ]; then
            echo 'parts=["custom"]' >> $GITHUB_OUTPUT
          else
            echo "parts=[\"$PART\"]" >> $GITHUB_OUTPUT
          fi

  download-and-upload:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.setup.outputs.parts) }}

    name: Download Part ${{ matrix.part }}

    steps:
      - name: Maximize Runner Disk Space
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "Cleaned disk space:"
          df -h

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg & 7-Zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg p7zip-full

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pycryptodome pymongo syncedlyrics Pillow

      - name: Setup YouTube Cookies (Optional)
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            echo "Loaded cookies.txt from secrets."
          else
            echo "No YOUTUBE_COOKIES secret configured. Using direct JioSaavn CDN."
          fi

      - name: Run Cloud Downloader & Upload to Gofile
        id: run_dl
        env:
          PYTHONUNBUFFERED: "1"
          CONCURRENT_DOWNLOADS: "10"
          PLAYLIST_URL: ${{ github.event.inputs.playlist_url }}
          PART_NUMBER: ${{ (matrix.part == 'test_5_songs' || matrix.part == 'custom') && '0' || matrix.part }}
          START_INDEX: ${{ matrix.part == 'test_5_songs' && '1' || (matrix.part == 'custom' && github.event.inputs.start_index || '0') }}
          END_INDEX: ${{ matrix.part == 'test_5_songs' && '5' || (matrix.part == 'custom' && github.event.inputs.end_index || '0') }}
          QUALITY: ${{ github.event.inputs.quality }}
          GOFILE_API_TOKEN: ${{ secrets.GOFILE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u github_action_download.py

      - name: Publish to GitHub Releases (Unblocked Fast CDN in India - No VPN Needed)
        id: publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd downloads || exit 0
          ZIP_NAME=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_NAME" ]; then
            TAG="Part-${{ matrix.part }}"
            gh release delete "$TAG" --yes 2>/dev/null || true

            ZIP_SIZE=$(stat -c%s "$ZIP_NAME")
            echo "Found $ZIP_NAME ($ZIP_SIZE bytes)"
            if [ "$ZIP_SIZE" -gt 2000000000 ]; then
              echo "File exceeds 2GB limit for single asset. Splitting with 7z..."
              7z a -v1900m "${ZIP_NAME}.7z" "$ZIP_NAME"
              rm -f "$ZIP_NAME"
              gh release create "$TAG" "${ZIP_NAME}.7z".* --title "Part ${{ matrix.part }} Songs (Direct Fast Download)" --notes "High-speed unblocked CDN download for India without VPN. Extract using 7-Zip or WinRAR."
            else
              gh release create "$TAG" "$ZIP_NAME" --title "Part ${{ matrix.part }} Songs (Direct Fast Download)" --notes "High-speed unblocked CDN download for India without VPN."
            fi
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            echo "release_url=${RELEASE_URL}" >> $GITHUB_OUTPUT
            echo "Published release: $RELEASE_URL"
          fi

      - name: Display Summary in GitHub Actions
        if: always()
        run: |
          echo "### 🎵 Download Task Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Playlist:** \`${{ github.event.inputs.playlist_url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Part:** \`${{ matrix.part }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality:** \`${{ github.event.inputs.quality }} kbps\`" >> $GITHUB_STEP_SUMMARY
          echo "- **🚀 Direct GitHub CDN Link (No VPN Needed in India):** ${{ steps.publish_release.outputs.release_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **📁 Gofile Mirror:** ${{ steps.run_dl.outputs.gofile_url }}" >> $GITHUB_STEP_SUMMARY
