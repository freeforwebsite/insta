name: Spotify Playlist Cloud Downloader

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: "Spotify Playlist or Track URL"
        required: true
        default: "https://open.spotify.com/playlist/7eMHkKCKwelg7afYViQMAf"
      part:
        description: "Select Part ('test_5_songs' for 30s quick check, 'all' for overnight)"
        required: true
        type: choice
        options:
          - "all"
          - "test_5_songs"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "custom"
        default: "all"
      start_index:
        description: "Custom Start Index (Only used if part is 'custom')"
        required: false
        default: "1"
      end_index:
        description: "Custom End Index (Only used if part is 'custom')"
        required: false
        default: "5"
      quality:
        description: "Audio Bitrate (kbps)"
        required: true
        type: choice
        options:
          - "320"
          - "192"
          - "128"
        default: "320"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.set-parts.outputs.parts }}
    steps:
      - id: set-parts
        run: |
          PART="${{ github.event.inputs.part }}"
          if [ "$PART" = "all" ]; then
            echo 'parts=["1", "2", "3", "4", "5"]' >> $GITHUB_OUTPUT
          elif [ "$PART" = "test_5_songs" ]; then
            echo 'parts=["test_5_songs"]' >> $GITHUB_OUTPUT
          elif [ "$PART" = "custom" ]; then
            echo 'parts=["custom"]' >> $GITHUB_OUTPUT
          else
            echo "parts=[\"$PART\"]" >> $GITHUB_OUTPUT
          fi

  download-and-upload:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.setup.outputs.parts) }}

    name: Download Part ${{ matrix.part }}

    steps:
      - name: Maximize Runner Disk Space
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "Cleaned disk space:"
          df -h

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pycryptodome pymongo syncedlyrics Pillow

      - name: Setup YouTube Cookies (Optional)
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            echo "Loaded cookies.txt from secrets."
          else
            echo "No YOUTUBE_COOKIES secret configured. Using direct JioSaavn CDN."
          fi

      - name: Run Cloud Downloader & Upload to Gofile
        id: run_dl
        env:
          PYTHONUNBUFFERED: "1"
          PLAYLIST_URL: ${{ github.event.inputs.playlist_url }}
          PART_NUMBER: ${{ (matrix.part == 'test_5_songs' || matrix.part == 'custom') && '0' || matrix.part }}
          START_INDEX: ${{ matrix.part == 'test_5_songs' && '1' || (matrix.part == 'custom' && github.event.inputs.start_index || '0') }}
          END_INDEX: ${{ matrix.part == 'test_5_songs' && '5' || (matrix.part == 'custom' && github.event.inputs.end_index || '0') }}
          QUALITY: ${{ github.event.inputs.quality }}
          GOFILE_API_TOKEN: ${{ secrets.GOFILE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u github_action_download.py

      - name: Display Summary in GitHub Actions
        if: always()
        run: |
          echo "### 🎵 Download Task Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Playlist:** \`${{ github.event.inputs.playlist_url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Part:** \`${{ matrix.part }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality:** \`${{ github.event.inputs.quality }} kbps\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Gofile Link:** ${{ steps.run_dl.outputs.gofile_url }}" >> $GITHUB_STEP_SUMMARY
